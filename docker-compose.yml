services:

  nginx:
    image: nginx:alpine
    ports:
      - "5001:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${USERPROFILE}/.aspnet/https:/etc/nginx/certs:ro
    depends_on:
      - starter-app-dev

  starter-app-dev:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: build
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DB_CONNECTION=${DB_CONNECTION}
    volumes:
      - .:/src
      - /src/bin
      - /src/obj
    command: dotnet run --project Starter-App.csproj --urls "http://+:8080"